; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


; การตั้งค่าส่วนกลาง (ใช้ร่วมกันทุก Node)
[env]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
; ไม่ต้องใช้ lib_extra_dirs แล้ว เพราะ Library อยู่ในโฟลเดอร์ lib ของโปรเจกต์แล้ว PlatformIO จะหาเจอเอง

; --- Environment สำหรับแต่ละ Node ---

[env:node_1_jd]
build_src_filter = +<Data_Node_1_JD.cpp>

[env:node_2_phranon]
build_src_filter = +<Data_Node_2_PhraNon.cpp>

[env:node_3_thamyai]
build_src_filter = +<Data_Node_3_ThamYai.cpp>

[env:node_4_rongpui]
build_src_filter = +<Data_Node_4_RongPui.cpp>

[env:repeater_node_5]
build_src_filter = +<Repeater_Node_5.cpp>

[env:master_node_6]
build_src_filter = +<Master_Node_6_MainPannel.cpp>
