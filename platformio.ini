; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


; การตั้งค่าส่วนกลาง (ใช้ร่วมกันทุก Node)
[env]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = time
; ไม่ต้องใช้ lib_extra_dirs แล้ว เพราะ Library อยู่ในโฟลเดอร์ lib ของโปรเจกต์แล้ว PlatformIO จะหาเจอเอง

; --- Environment สำหรับแต่ละ Node ---

[env:node_1_jd]
build_src_filter = +<Node_01_JD.cpp>

[env:node_2_3_phranon_plastic]
build_src_filter = +<Node_02_03_PhraNon_Plastic.cpp>

[env:node_4_thamyai]
build_src_filter = +<Node_04_ThamYai.cpp>

[env:node_5_rongpui]
build_src_filter = +<Node_05_RongPui.cpp>

[env:node_6_taifa]
build_src_filter = +<Node_06_TaiFa.cpp>

[env:node_7_khonpd]
build_src_filter = +<Node_07_KhonPD.cpp>

[env:node_8_suanmm]
build_src_filter = +<Node_08_SuanMM.cpp>

[env:node_20_nongpog]
build_src_filter = +<Node_20_SPD_NongPog.cpp>

[env:repeater_node_101]
build_src_filter = +<Node_101_Repeater.cpp>

[env:master_node_100]
build_src_filter = +<Node_100_Master_MainPannel.cpp>

[env:node_test_thamyai_sender]
build_src_filter = +<Node_Test_ThamYai_LoRa_Sender.cpp>

[env:node_test_repeater_receiver]
build_src_filter = +<Node_Test_Repeater_Receiver.cpp>

[env:Hardware_Test_Pin47]
build_src_filter = +<Hardware_Test_Pin47.cpp>

[env:master_test_relay_led]
build_src_filter = +<Node_Test_Master_RelayLED.cpp>

[env:node_test_jd_nosensor]
extends = env:node_1_jd
build_src_filter = +<Node_Test_JD_NoSensor.cpp>

[env:node_test_vext_out_pin]
build_src_filter = +<Node_Test_Vext_Out_Pin.cpp>

[env:node_test_battery_button]
build_src_filter = +<Node_Test_Battery_Button.cpp>

[env:board_health_check_new]
build_src_filter = +<Board_Health_Check_NewBoard.cpp>

[env:board_health_check_suspect]
build_src_filter = +<Board_Health_Check_SuspectBoard.cpp>
